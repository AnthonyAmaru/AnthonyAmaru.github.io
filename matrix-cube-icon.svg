<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">Matrix binary cube</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a24" />
      <stop offset="1" stop-color="#07150d" />
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2515" />
      <stop offset="1" stop-color="#041008" />
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12351e" />
      <stop offset="1" stop-color="#06110a" />
    </linearGradient>
    <clipPath id="top-face"><polygon points="60,7 111,35 60,64 9,35" /></clipPath>
    <clipPath id="left-face"><polygon points="9,35 60,64 60,113 9,84" /></clipPath>
    <clipPath id="right-face"><polygon points="60,64 111,35 111,84 60,113" /></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g stroke="#65f58c" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="60,7 111,35 60,64 9,35" fill="url(#top)" />
    <polygon points="9,35 60,64 60,113 9,84" fill="url(#left)" />
    <polygon points="60,64 111,35 111,84 60,113" fill="url(#right)" />
  </g>

  <g fill="#73ff98" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" filter="url(#glow)">
    <g clip-path="url(#top-face)" opacity=".92">
      <text x="28" y="24">0100101</text>
      <text x="18" y="36">101101001</text>
      <text x="33" y="48">0010110</text>
    </g>
    <g clip-path="url(#left-face)" opacity=".82">
      <text x="13" y="51">01010</text>
      <text x="15" y="64">101001</text>
      <text x="17" y="77">00110</text>
      <text x="25" y="90">1101</text>
    </g>
    <g clip-path="url(#right-face)" opacity=".9">
      <text x="65" y="52">10101</text>
      <text x="64" y="66">010010</text>
      <text x="66" y="80">11010</text>
      <text x="65" y="94">001101</text>
    </g>
  </g>

  <g fill="none" stroke="#a1ffb6" stroke-width="1" opacity=".8">
    <path d="M60 7v57l51 20M60 64 9 84" />
  </g>
</svg>
