    <aside class="site-music-bar" data-site-music-bar aria-label="Music player">
      <div class="site-music-copy"><small>Now playing</small><strong data-site-music-title>Nothing selected</strong></div>
      <select data-site-music-select aria-label="Choose a song"><option value="">Loading music</option></select>
      <audio preload="metadata"></audio>
      <button type="button" data-site-music-previous aria-label="Previous song">‹</button>
      <button type="button" data-site-music-play aria-label="Play or pause">▶</button>
      <button type="button" data-site-music-next aria-label="Next song">›</button>
    </aside>
    <main id="main-content" class="health-page">
      <header class="health-heading">
        <div><span aria-hidden="true">🩺</span><h1>Health</h1></div>
        <time data-health-as-of hidden></time>
      </header>

      <section class="health-lock" data-health-lock aria-labelledby="health-lock-title">
        <span aria-hidden="true">🔒</span>
        <h2 id="health-lock-title">Admin approval required</h2>
        <form data-health-auth>
          <label for="health-password">Admin password</label>
          <div><input id="health-password" type="password" autocomplete="current-password" required /><button type="submit">Unlock</button></div>
        </form>
        <p data-health-message role="status" aria-live="polite"></p>
      </section>

      <section class="health-dashboard" data-health-dashboard aria-label="Private bloodwork dashboard" hidden></section>
    </main>
