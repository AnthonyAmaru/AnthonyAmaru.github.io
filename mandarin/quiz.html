<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f0" />
    <title>Mandarin Practice · Anthony Amaru</title>
    <link rel="icon" href="../anthony-favicon.ico?v=snake-1" sizes="any" />
    <link rel="stylesheet" href="../aviation/styles.css?v=20260803-palette1" />
    <link rel="stylesheet" href="quiz.css?v=20260803-compact2" />
    <script src="../music-cloud.js"></script>
    <script src="quiz.js?v=20260803-compact2" defer></script>
  </head>
  <body>
    <div id="admin-lock" class="admin-lock" hidden>
      <form id="mandarin-unlock-form" class="unlock-card">
        <span class="mini-mark">好</span>
        <h1>Admin</h1>
        <label><span>Password</span><input id="mandarin-password" type="password" autocomplete="current-password" required /></label>
        <p id="mandarin-password-error" class="form-error" role="alert"></p>
        <button class="button primary" type="submit">Unlock</button>
      </form>
    </div>

    <header class="app-header">
      <div>
        <h1>Mandarin Quiz</h1>
      </div>
      <div class="header-score"><span>Last score</span><strong id="last-score">—</strong></div>
    </header>

    <main>
      <section id="setup-view" class="view active">
        <div class="intro-grid">
          <article class="panel setup-panel">
            <h2>Quiz</h2>
            <div class="field-grid quiz-fields">
              <label><span>Question type</span><select id="quiz-type"><option value="mixed">Mixed practice</option><option value="word">Word meanings</option><option value="sentence">Sentences</option></select></label>
              <label><span>Questions</span><select id="question-count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="20">20 questions</option></select></label>
            </div>
            <button id="start-quiz" class="button primary" type="button">Start</button>
          </article>
          <article class="panel history-panel">
            <div class="panel-heading"><div><p id="history-sync-status" class="eyebrow">Device</p><h2>Scores</h2></div><button id="clear-history" class="text-button" type="button">Clear</button></div>
            <div id="history-list" class="history-list"></div>
          </article>
        </div>
      </section>

      <section id="quiz-view" class="view">
        <div class="quiz-topline"><button id="exit-quiz" class="text-button" type="button">← Exit</button><div class="quiz-progress-copy"><span id="quiz-position"></span><strong id="quiz-running-score">0 correct</strong></div></div>
        <div class="progress-track"><span id="quiz-progress"></span></div>
        <article class="panel question-card mandarin-card">
          <div class="question-meta"><span id="question-type"></span><span id="question-pinyin"></span></div>
          <p id="question-chinese" class="question-chinese" lang="zh-Hans"></p>
          <h2 id="question-text"></h2>
          <div id="answer-options" class="answer-options"></div>
          <div id="answer-feedback" class="answer-feedback" hidden></div>
          <div class="question-actions"><button id="check-answer" class="button primary" type="button" disabled>Check</button><button id="next-question" class="button primary" type="button" hidden>Next</button></div>
        </article>
      </section>

      <section id="results-view" class="view">
        <article class="panel results-card">
          <span class="result-ring" id="result-percent">0%</span>
          <h2 id="result-title"></h2>
          <p id="result-summary"></p>
          <div class="result-actions"><button id="new-quiz" class="button primary" type="button">New quiz</button><button id="review-wrong" class="button secondary" type="button">Missed</button></div>
        </article>
        <div id="wrong-list" class="wrong-list"></div>
      </section>
    </main>
  </body>
</html>
