<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f0" />
    <title>Mandarin Practice · Anthony Amaru</title>
    <link rel="icon" href="../anthony-favicon.ico?v=snake-1" sizes="any" />
    <script src="../site-theme.js?v=20260806-study2"></script>
    <link rel="stylesheet" href="../site-header.css?v=20260806-study2" />
    <link rel="stylesheet" href="../site-music.css?v=20260806-study2" />
    <link rel="stylesheet" href="../aviation/styles.css?v=20260806-writing1" />
    <link rel="stylesheet" href="quiz.css?v=20260808-mastery1" />
    <link rel="stylesheet" href="speech-settings.css?v=20260808-lessons1" />
    <script src="../music-cloud.js"></script>
    <script src="../site-header.js?v=20260806-study2" defer></script>
    <script src="../site-music.js?v=20260808-sharedmusic1" defer></script>
    <script src="../site-ai.js?v=20260806-study2" defer></script>
    <script src="lesson-data.js?v=20260808-mastery1" defer></script>
    <script src="speech-settings.js?v=20260808-lessons1" defer></script>
    <script src="quiz.js?v=20260808-mastery1" defer></script>
  </head>
  <body>
    <div id="admin-lock" class="admin-lock" hidden>
      <section class="unlock-card">
        <span class="mini-mark">好</span>
        <h1>Interests locked</h1>
        <a class="button primary" href="../index.html?page=interests&amp;v=20260806-interestslock1" target="_top">Unlock Interests</a>
      </section>
    </div>

    <header class="main-site-header">
      <a class="main-site-brand" href="../index.html?v=20260803-nav1" aria-label="Anthony Amaru home"><img src="../anthony-brand-icon.png" alt="" /><strong>Anthony Amaru</strong></a>
      <button class="main-site-menu" type="button" data-main-site-menu aria-expanded="false" aria-controls="main-site-nav">Menu</button>
      <nav id="main-site-nav" class="main-site-nav" data-main-site-nav aria-label="Primary navigation">
        <a href="../index.html?page=resume&amp;v=20260807-cloudprogress1">Resume</a>
        <a href="../index.html?page=interests&amp;v=20260807-cloudprogress1" aria-current="page">Interests</a>
        <a href="../index.html?page=music&amp;v=20260807-cloudprogress1">Music</a>
      </nav>
    </header>

    <aside class="site-music-bar" data-site-music-bar aria-label="Music player">
      <div class="site-music-copy"><small>Now playing</small><strong data-site-music-title>Nothing selected</strong></div>
      <select data-site-music-select aria-label="Choose a song"><option value="">Loading music</option></select>
      <audio preload="metadata"></audio>
      <button type="button" data-site-music-previous aria-label="Previous song">‹</button>
      <button type="button" data-site-music-play aria-label="Play or pause">▶</button>
      <button type="button" data-site-music-next aria-label="Next song">›</button>
    </aside>

    <header class="app-header">
      <div>
        <h1>Mandarin Quiz</h1>
      </div>
      <div class="header-score"><span>Last score</span><strong id="last-score">—</strong></div>
    </header>

    <main>
      <nav class="mandarin-section-menu" aria-label="Mandarin study sections">
        <a data-lesson-link="lesson-1" href="index.html?page=lesson&amp;lesson=lesson-1&amp;v=20260808-mastery1">Lesson 1</a>
        <a data-preserve-lesson href="index.html?page=cards&amp;lesson=lesson-1&amp;v=20260808-mastery1">Cards</a>
        <a data-preserve-lesson href="index.html?page=sounds&amp;lesson=lesson-1&amp;v=20260808-mastery1">Sounds</a>
        <a data-preserve-lesson href="index.html?page=words&amp;lesson=lesson-1&amp;v=20260808-mastery1">Words</a>
        <a data-preserve-lesson href="index.html?page=writing&amp;lesson=lesson-1&amp;v=20260808-mastery1">Writing</a>
        <a data-preserve-lesson href="index.html?page=practice&amp;lesson=lesson-1&amp;v=20260808-mastery1">Practice</a>
        <a data-preserve-lesson data-quiz-link href="quiz.html?lesson=lesson-1&amp;v=20260808-mastery1" aria-current="page">Quiz</a>
      </nav>

      <section id="setup-view" class="view active">
        <div class="intro-grid">
          <article class="panel setup-panel">
            <h2>Quiz</h2>
            <div class="field-grid quiz-fields">
              <label><span>Question type</span><select id="quiz-type"><option value="mixed">Mixed practice</option><option value="word">Word meanings</option><option value="sentence">Sentences</option></select></label>
              <label><span>Questions</span><select id="question-count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="20">20 questions</option></select></label>
            </div>
            <button id="start-quiz" class="button primary" type="button">Start</button>
            <div class="wrong-bank-panel">
              <span><strong id="wrong-bank-count">0</strong> saved misses</span>
              <button id="start-wrong-bank" class="button secondary" type="button" disabled>Test wrong bank</button>
            </div>
          </article>
          <article class="panel history-panel">
            <div class="panel-heading"><div><p id="history-sync-status" class="eyebrow">Device</p><h2>Scores</h2></div><button id="clear-history" class="text-button" type="button">Clear</button></div>
            <div id="history-list" class="history-list"></div>
          </article>
        </div>
      </section>

      <section id="quiz-view" class="view">
        <div class="quiz-topline"><button id="exit-quiz" class="text-button" type="button">← Exit</button><div class="quiz-progress-copy"><span id="quiz-position"></span><strong id="quiz-running-score">0 correct</strong></div></div>
        <div class="progress-track"><span id="quiz-progress"></span></div>
        <article class="panel question-card mandarin-card">
          <div class="question-meta"><span id="question-type"></span><span id="question-pinyin"></span></div>
          <p id="question-chinese" class="question-chinese speakable-mandarin" lang="zh-Hans" role="button" tabindex="0" title="Tap to hear Mandarin"></p>
          <button id="speak-question" class="speech-button" type="button" aria-label="Speak this Mandarin question" title="Speak Mandarin">🔊</button>
          <h2 id="question-text"></h2>
          <div id="answer-options" class="answer-options"></div>
          <div id="answer-feedback" class="answer-feedback" hidden></div>
          <div class="question-actions"><button id="previous-question" class="button secondary" type="button">Previous</button><button id="check-answer" class="button primary" type="button" disabled>Check</button><button id="next-question" class="button primary" type="button" hidden>Next</button></div>
        </article>
      </section>

      <section id="results-view" class="view">
        <article class="panel results-card">
          <span class="result-ring" id="result-percent">0%</span>
          <h2 id="result-title"></h2>
          <p id="result-summary"></p>
          <div class="result-actions"><button id="new-quiz" class="button primary" type="button">New quiz</button><button id="review-wrong" class="button secondary" type="button">Missed</button></div>
        </article>
        <div id="wrong-list" class="wrong-list"></div>
      </section>
    </main>
  </body>
</html>
